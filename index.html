<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zinni — Your day, at your pace</title><meta name="theme-color" content="#61775e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29392e;background:#f7f5f0;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.app{max-width:490px;min-height:100vh;margin:auto;padding:24px 18px 60px}.top{display:flex;align-items:center;gap:13px;margin-bottom:28px}.logo{background:#61775e;color:white;border-radius:17px;width:62px;height:62px;display:grid;place-items:center;font-size:29px}.grow{flex:1}h1,h2,h3,p{margin:0}h1{font-size:29px;letter-spacing:-.6px}h2{font-size:27px;line-height:1.2;margin-bottom:8px}h3{font-size:17px}small,.muted,.sub{color:#6f786e}.sub{line-height:1.5;margin-bottom:18px}.card{background:white;border:1px solid #e4e5df;border-radius:19px;padding:19px;margin:14px 0;box-shadow:0 2px 10px #29392e08}.btn{width:100%;border:0;border-radius:12px;padding:14px 16px;background:#5d725a;color:white;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px}.secondary{background:#eef1eb;color:#304531}.ghost{background:transparent;color:#536750}.smallbtn{border:1px solid #d9dfd6;border-radius:10px;background:white;padding:9px 11px;color:#304531;cursor:pointer}.menu{font-size:22px;min-width:62px;min-height:58px}.emoji{display:flex;gap:7px;margin:12px 0 24px}.emoji button{flex:1;min-width:0;border:1px solid #e0e4dd;background:white;border-radius:11px;padding:12px 0;cursor:pointer;font-size:23px}.emoji button.active{border:2px solid #5d725a;background:#eaf0e7}label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #d9dfd6;border-radius:10px;background:white;font:inherit;color:#29392e}input[type=checkbox],input[type=radio]{width:auto}.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}.line{border-bottom:1px solid #eceee9;padding:13px 0;display:flex;align-items:center;gap:10px}.line:last-child{border:0}.pill,.badge{font-size:11px;background:#edf1eb;padding:6px 9px;border-radius:30px;color:#536750}.hidden{display:none!important}.note{font-size:13px;color:#667366;line-height:1.5}.time{font-size:12px;color:#6c766c;min-width:76px}.block{border-left:3px solid #a0b19a;padding:13px;background:white;border-radius:0 12px 12px 0;margin:9px 0;display:flex;gap:10px;align-items:center}.block.fixed{border-left-color:#727a7c;background:#f0f0ee}.row{display:flex;align-items:center;gap:8px}.space{justify-content:space-between}.menuPanel{margin:-13px 0 20px}.menuPanel button{display:block;width:100%;text-align:left;padding:14px;border:0;background:white;border-bottom:1px solid #e5e8e2;cursor:pointer;color:#304531;font-size:15px}.menuPanel button:first-child{border-radius:12px 12px 0 0}.menuPanel button:last-child{border-radius:0 0 12px 12px}.mt{margin-top:18px}.detail{margin-top:8px}.sectionTitle{margin:24px 0 10px}.days{display:flex;gap:5px;flex-wrap:wrap}.days label{font-size:12px;font-weight:500;border:1px solid #dce1d9;padding:8px;border-radius:9px;margin:0;cursor:pointer}.error{color:#a13c37}button:disabled{opacity:.5;cursor:not-allowed}
</style></head><body><main class="app"><header class="top"><div class="logo">🌱</div><div class="grow"><h1>Zinni</h1><small>Your day, at your pace.</small></div><button class="smallbtn menu" id="menuBtn" aria-label="Open menu">☰</button></header><nav id="menu" class="menuPanel hidden"><button data-page="home">☀️ Today</button><button data-page="tasks">☑ One-time tasks</button><button data-page="goals">↻ Persistent goals</button><button data-page="review">▥ Weekly review</button><button data-page="settings">⚙ Settings</button><button id="installBtn" class="hidden">＋ Install Zinni as an app</button><p id="installHelp" class="note hidden" style="padding:12px 14px">To install, open this site in your browser menu and choose “Install app” or “Add to Home Screen”.</p></nav><div id="view"><h2>Good morning!</h2><p class="sub">How are you feeling today?</p><div class="card">Loading your check-in…</div></div></main>
<script>
(function(){
'use strict';
const KEY='zinni_v2';
const defaults={tasks:[],goals:[],mood:3,energy:3,checkDate:'',plan:'',dayStart:'08:00',dayEnd:'21:00',wakeTime:'07:00',workDays:[1,2,3,4,5],workStart:'09:00',workEnd:'17:00',commute:30,lockWork:true,lockCommute:true,routine:30,prep:30,completedSessions:[]};
let data;try{data=Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'));if(!Array.isArray(data.tasks)||!Array.isArray(data.goals))throw Error('Invalid saved data');}catch(e){data=Object.assign({},defaults)}
let page='home',stage=(data.checkDate===dateKey(new Date())&&data.plan)?'timeline':'check',menuOpen=false,taskForm=false,goalForm=false,advanced=false,overflow=false,change=null;
const $=id=>document.getElementById(id);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function minutes(s){let a=String(s||'00:00').split(':').map(Number);return a[0]*60+a[1]}
function clock(n){return String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function pretty(n){let h=Math.floor(n/60)%24;return (h%12||12)+':'+String(n%60).padStart(2,'0')+' '+(h>=12?'PM':'AM')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn('Could not save locally',e)}}
function nav(p){page=p;menuOpen=false;taskForm=false;goalForm=false;render()}
function fixedBlocks(date){let res=[],day=date.getDay(),start=minutes(data.wakeTime||data.dayStart);function add(a,b,name){if(b>a)res.push({start:a,end:b,name,fixed:true})}add(start,start+Number(data.routine),'Morning routine');add(start+Number(data.routine),start+Number(data.routine)+Number(data.prep),'Get ready');if(data.workDays.includes(day)){let ws=minutes(data.workStart),we=minutes(data.workEnd),c=Number(data.commute);if(data.lockCommute&&c){add(ws-c,ws,'Commute to work');add(we,we+c,'Commute home')}if(data.lockWork)add(ws,we,'Work')}return res}
function schedule(date,mode){let start=minutes(data.wakeTime||data.dayStart),end=minutes(data.dayEnd),blocks=fixedBlocks(date);let candidates=data.tasks.filter(t=>!t.done&&!t.deferred&&(!t.date||t.date<=dateKey(date))&&(dateKey(date)===dateKey(new Date())||t.date===dateKey(date))).map(t=>Object.assign({},t,{source:'task'}));data.goals.forEach(g=>{if(g.days.includes(date.getDay())&&!data.completedSessions.some(s=>s.goal===g.id&&s.date===dateKey(date))){let n=data.completedSessions.filter(s=>s.goal===g.id&&weekStart(s.date)===weekStart(dateKey(date))).length;if(n<g.target)candidates.push({id:'g-'+g.id,name:g.name,duration:g.duration,priority:g.priority||'Would like to do',source:'goal',goal:g})}});let rank=t=>({'Must do':100,'Would like to do':50,'OK if skipped':10}[t.priority]||50)+(t.deadline?Math.max(0,70-Math.max(0,(new Date(t.deadline+'T12:00:00')-date)/86400000)*15):0)+(Number(t.consequence||3)*10);candidates.sort((a,b)=>rank(b)-rank(a));let unscheduled=[];for(let t of candidates){let len=Number(t.duration)||30,lo=start,hi=end-len;if(t.source==='goal'){lo=Math.max(lo,minutes(t.goal.start));hi=t.goal.timing==='fixed'?minutes(t.goal.start):Math.min(hi,minutes(t.goal.end)-len)}if(t.earliest)lo=Math.max(lo,minutes(t.earliest));if(t.latest)hi=Math.min(hi,minutes(t.latest)-len);if(t.approvedStart)lo=hi=minutes(t.approvedStart);let slots=[];for(let x=lo;x<=hi;x+=15)if(x>=start&&x+len<=end&&!blocks.some(b=>x<b.end&&x+len>b.start))slots.push(x);if(slots.length){let at=mode==='balanced'?slots[Math.floor((slots.length-1)/2)]:slots[0];blocks.push({start:at,end:at+len,name:t.name,id:t.id,source:t.source,fixed:false})}else unscheduled.push(t)}return {blocks:blocks.sort((a,b)=>a.start-b.start),unscheduled}}
function weekStart(s){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return dateKey(d)}
function home(){if(stage==='check')return `<h2>Good morning!</h2><p class="sub">How are you feeling today?</p><div class="card"><label for="wakeTime">What time did you wake up today?</label><input id="wakeTime" type="time" value="${esc(data.wakeTime||data.dayStart)}"><p class="note detail">Zinni will plan around your actual start to the day.</p><h3>Mood</h3><div class="emoji">${['😞','😕','😐','🙂','😄'].map((x,i)=>`<button data-mood="${i+1}" class="${data.mood===i+1?'active':''}" aria-label="Mood ${i+1}">${x}</button>`).join('')}</div><h3>Energy</h3><div class="emoji">${['🪫','😴','😐','⚡','🔋'].map((x,i)=>`<button data-energy="${i+1}" class="${data.energy===i+1?'active':''}" aria-label="Energy ${i+1}">${x}</button>`).join('')}</div><button class="btn" id="suggest">Suggest my plan →</button></div><p class="note">Just two questions. Zinni uses your saved tasks and commitments for the rest.</p>`;
if(stage==='plans')return `<h2>Your plans for today</h2><p class="sub">Choose the approach that feels right. Both protect fixed commitments.</p><div class="card"><h3>Balanced Day</h3><p class="note detail">Spreads flexible tasks across open time for a gentler pace.</p><button class="btn" data-choose="balanced">Choose Balanced Day</button></div><div class="card"><h3>Priority First</h3><p class="note detail">Places the most important and consequential tasks into earlier available slots.</p><button class="btn" data-choose="priority">Choose Priority First</button></div><button class="btn ghost" id="backCheck">Back</button>`;
let sch=schedule(new Date(),data.plan||'balanced');return `<div class="row space"><div><small>TODAY · ${esc(new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}))}</small><h2>Your timeline</h2></div><span class="pill">${data.plan==='priority'?'Priority First':'Balanced Day'}</span></div><p class="sub">Mood ${data.mood}/5 · Energy ${data.energy}/5</p>${sch.blocks.length?sch.blocks.map(b=>`<div class="block ${b.fixed?'fixed':''}"><div class="time">${pretty(b.start)}<br><small>${pretty(b.end)}</small></div><div class="grow"><strong>${esc(b.name)}</strong><div class="note">${b.fixed?'🔒 Fixed commitment':b.source==='goal'?'Persistent goal':'Task'}</div></div>${!b.fixed?`<button class="smallbtn" data-complete="${esc(b.id)}">✓</button>`:''}</div>`).join(''):'<div class="card"><h3>Your day is clear</h3><p class="note detail">Add a task from the menu whenever you need to.</p></div>'}${sch.unscheduled.length?`<div class="card"><h3>${sch.unscheduled.length} task(s) not scheduled</h3><p class="note detail">These stay unscheduled until you decide.</p><button class="btn secondary" id="overflow">Review options</button>${overflow?sch.unscheduled.map(t=>`<div class="line"><div class="grow"><strong>${esc(t.name)}</strong><p class="note">No slot is assigned automatically. You can edit the task or review another day.</p></div></div>`).join(''):''}</div>`:''}<button class="btn secondary" id="changePlan">Change plan</button><button class="btn ghost" id="requestBreak">Request a break</button>${change==='break'?`<div class="card"><h3>Request a break</h3><p class="note">Choose a duration. Zinni will propose a slot; nothing is added until you approve.</p><div class="two"><button class="btn secondary" data-break="10">10 min</button><button class="btn secondary" data-break="15">15 min</button></div><button class="btn ghost" id="cancelChange">Cancel</button></div>`:''}${change==='break-confirm'?`<div class="card"><h3>Approve a break?</h3><p class="note">Add a ${window.pendingBreak||10}-minute break to the next available slot?</p><button class="btn" id="approveBreak">Approve change</button><button class="btn ghost" id="cancelChange">Cancel</button></div>`:''}`}
function tasksPage(){return `<h2>One-time tasks</h2><p class="sub">Quickly add a task. Details are optional.</p><button class="btn" id="newTask">+ Add task</button>${taskForm?`<form class="card" id="taskForm"><h3>What kind of task?</h3><label><input type="radio" name="kind" value="one" checked> One-time task</label><label><input type="radio" name="kind" value="goal"> Persistent goal</label><label>Task name</label><input name="name" required maxlength="100" placeholder="What do you need to do?"><label>Duration (minutes)</label><input name="duration" type="number" min="15" max="480" step="15" value="30"><button type="button" class="btn secondary" id="advanced">${advanced?'Hide':'Show'} advanced options</button><div class="${advanced?'':'hidden'}"><label>Priority</label><select name="priority"><option>Would like to do</option><option>Must do</option><option>OK if skipped</option></select><label>Deadline (optional)</label><input name="deadline" type="date"><label>Consequence level (1–5)</label><input name="consequence" type="number" min="1" max="5" value="3"><label>Earliest start</label><input name="earliest" type="time"><label>Latest finish</label><input name="latest" type="time"></div><button class="btn" type="submit">Save task</button><button type="button" class="btn ghost" id="cancelTask">Cancel</button></form>`:''}${data.tasks.map(t=>`<div class="line"><button class="smallbtn" data-complete="${esc(t.id)}">${t.done?'↶':'✓'}</button><div class="grow"><strong style="${t.done?'text-decoration:line-through':''}">${esc(t.name)}</strong><p class="note">${t.duration} min · ${esc(t.priority||'Would like to do')}${t.deadline?' · Due '+esc(t.deadline):''}</p></div><button class="smallbtn" data-delete-task="${esc(t.id)}">✕</button></div>`).join('')||'<div class="card note">No tasks yet. Start with one small thing.</div>'}<button class="btn ghost" id="toGoals">Persistent goals →</button>`}
function goalsPage(){return `<h2>Persistent goals</h2><p class="sub">Choose days and a fixed time or time window for each goal.</p><button class="btn" id="newGoal">+ Add persistent goal</button>${goalForm?`<form class="card" id="goalForm"><label>Goal name</label><input name="name" required maxlength="100" placeholder="e.g. Study networking"><div class="two"><div><label>Sessions per week</label><input name="target" type="number" min="1" max="7" value="3" required></div><div><label>Minutes per session</label><input name="duration" type="number" min="15" max="480" step="15" value="45" required></div></div><label>Selected days</label><div class="days">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<label><input type="checkbox" name="day" value="${i}" ${[1,3,5].includes(i)?'checked':''}> ${d}</label>`).join('')}</div><label>Schedule type</label><select name="timing"><option value="window">Time window</option><option value="fixed">Fixed time</option></select><div class="two"><div><label>Start</label><input name="start" type="time" value="18:00" required></div><div><label>End (window)</label><input name="end" type="time" value="21:00" required></div></div><label>Priority</label><select name="priority"><option>Would like to do</option><option>Must do</option><option>OK if skipped</option></select><button class="btn" type="submit">Save goal</button><button type="button" class="btn ghost" id="cancelGoal">Cancel</button></form>`:''}${data.goals.map(g=>{let count=data.completedSessions.filter(s=>s.goal===g.id&&weekStart(s.date)===weekStart(dateKey(new Date()))).length;return `<div class="card"><div class="row space"><h3>${esc(g.name)}</h3><button class="smallbtn" data-delete-goal="${esc(g.id)}">✕</button></div><p class="note detail">${g.days.map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(' · ')} · ${g.duration} min · ${g.timing==='fixed'?'Fixed at '+g.start:g.start+'–'+g.end}</p><p class="note detail">This week: ${count}/${g.target} sessions</p><button class="btn secondary" data-session="${esc(g.id)}">Mark a session complete</button></div>`}).join('')||'<div class="card note">No recurring goals yet.</div>'}<p class="note mt">Missed sessions remain unscheduled until you decide on a new slot.</p>`}
function settingsPage(){return `<h2>Settings</h2><p class="sub">Detailed controls stay out of your morning check-in.</p><form id="settingsForm" class="card"><h3>Daily availability</h3><label>Usual wake-up time</label><input type="time" name="wakeTime" value="${esc(data.wakeTime||data.dayStart)}"><div class="two"><div><label>Day starts</label><input type="time" name="dayStart" value="${esc(data.dayStart)}"></div><div><label>Day ends</label><input type="time" name="dayEnd" value="${esc(data.dayEnd)}"></div></div><h3 class="sectionTitle">Work and commute</h3><label>Workdays</label><div class="days">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<label><input type="checkbox" name="workDay" value="${i}" ${data.workDays.includes(i)?'checked':''}> ${d}</label>`).join('')}</div><div class="two"><div><label>Work starts</label><input name="workStart" type="time" value="${esc(data.workStart)}"></div><div><label>Work ends</label><input name="workEnd" type="time" value="${esc(data.workEnd)}"></div></div><label><input type="checkbox" name="lockWork" ${data.lockWork?'checked':''}> Lock work time</label><label><input type="checkbox" name="lockCommute" ${data.lockCommute?'checked':''}> Lock commute</label><label>Commute each way (minutes)</label><input name="commute" type="number" min="0" max="180" step="5" value="${data.commute}"><h3 class="sectionTitle">Morning routine</h3><div class="two"><div><label>Routine (min)</label><input name="routine" type="number" min="0" max="180" step="15" value="${data.routine}"></div><div><label>Get ready (min)</label><input name="prep" type="number" min="0" max="180" step="15" value="${data.prep}"></div></div><button class="btn" type="submit">Save settings</button></form><div class="card"><h3>Data</h3><p class="note detail">Saved in this browser. Export a backup before clearing browser data.</p><button class="btn secondary" id="export">Download backup (JSON)</button><label>Restore backup</label><input type="file" id="import" accept="application/json,.json"></div>`}
function reviewPage(){let done=data.tasks.filter(t=>t.done).length,total=data.tasks.length;return `<h2>Weekly review</h2><p class="sub">Review progress and consider improvements. Nothing changes without your approval.</p><div class="card"><h3>One-time tasks</h3><h2 class="mt">${done} / ${total}</h2><p class="note">Completed tasks</p></div><div class="card"><h3>Persistent sessions</h3>${data.goals.map(g=>{let n=data.completedSessions.filter(s=>s.goal===g.id&&weekStart(s.date)===weekStart(dateKey(new Date()))).length;return `<div class="line"><span class="grow">${esc(g.name)}</span><strong>${n}/${g.target}</strong></div>`}).join('')||'<p class="note detail">No persistent goals yet.</p>'}</div><div class="card"><h3>Next week</h3><p class="note detail">Review task duration estimates, completed sessions, and patterns. Personalized learning from long-term history will be expanded in a later version.</p></div>`}
function render(){try{$('menu').classList.toggle('hidden',!menuOpen);let v=$('view');v.innerHTML=page==='home'?home():page==='tasks'?tasksPage():page==='goals'?goalsPage():page==='settings'?settingsPage():reviewPage();bind()}catch(err){console.error(err);$('view').innerHTML='<div class="card"><h2>Something went wrong</h2><p class="note">'+esc(err.message||err)+'</p><button class="btn" onclick="location.reload()">Refresh app</button></div>'}}
function bind(){if($('wakeTime'))$('wakeTime').onchange=()=>{data.wakeTime=$('wakeTime').value||data.dayStart;save()};document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{data.mood=Number(b.dataset.mood);save();render()});document.querySelectorAll('[data-energy]').forEach(b=>b.onclick=()=>{data.energy=Number(b.dataset.energy);save();render()});if($('suggest'))$('suggest').onclick=()=>{stage='plans';render()};if($('backCheck'))$('backCheck').onclick=()=>{stage='check';render()};document.querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>{data.plan=b.dataset.choose;data.checkDate=dateKey(new Date());save();stage='timeline';render()});if($('changePlan'))$('changePlan').onclick=()=>{stage='plans';render()};if($('overflow'))$('overflow').onclick=()=>{overflow=!overflow;render()};document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{let id=b.dataset.complete;if(id.startsWith('g-')){let goal=id.slice(2);if(!data.completedSessions.some(s=>s.goal===goal&&s.date===dateKey(new Date())))data.completedSessions.push({goal,date:dateKey(new Date())})}else{let t=data.tasks.find(t=>String(t.id)===id);if(t)t.done=!t.done}save();render()});document.querySelectorAll('[data-defer]').forEach(b=>b.onclick=()=>{let t=data.tasks.find(t=>String(t.id)===b.dataset.defer);if(t)t.deferred=true;save();render()});if($('requestBreak'))$('requestBreak').onclick=()=>{change='break';render()};document.querySelectorAll('[data-break]').forEach(b=>b.onclick=()=>{window.pendingBreak=Number(b.dataset.break);change='break-confirm';render()});if($('cancelChange'))$('cancelChange').onclick=()=>{change=null;render()};if($('approveBreak'))$('approveBreak').onclick=()=>{let dur=window.pendingBreak||10,sch=schedule(new Date(),data.plan||'balanced'),found=null;for(let x=minutes(data.dayStart);x+dur<=minutes(data.dayEnd);x+=15)if(!sch.blocks.some(b=>x<b.end&&x+dur>b.start)){found=x;break}if(found!==null){data.tasks.push({id:uid(),name:'Requested break',duration:dur,priority:'Must do',date:dateKey(new Date()),approvedStart:clock(found),done:false});save();alert('Break proposed at '+pretty(found))}else alert('No available time for this break');change=null;render()};if($('newTask'))$('newTask').onclick=()=>{taskForm=!taskForm;render()};if($('cancelTask'))$('cancelTask').onclick=()=>{taskForm=false;render()};if($('advanced'))$('advanced').onclick=()=>{advanced=!advanced;render()};if($('taskForm'))$('taskForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(f.get('kind')==='goal'){taskForm=false;page='goals';goalForm=true;render();return}let t={id:uid(),name:String(f.get('name')).trim(),duration:Number(f.get('duration')),priority:f.get('priority')||'Would like to do',deadline:f.get('deadline')||'',consequence:Number(f.get('consequence'))||3,earliest:f.get('earliest')||'',latest:f.get('latest')||'',done:false};if(!t.name||t.duration<15)return;data.tasks.push(t);save();taskForm=false;render()};document.querySelectorAll('[data-delete-task]').forEach(b=>b.onclick=()=>{if(confirm('Delete this task?')){data.tasks=data.tasks.filter(t=>String(t.id)!==b.dataset.deleteTask);save();render()}});if($('toGoals'))$('toGoals').onclick=()=>nav('goals');if($('newGoal'))$('newGoal').onclick=()=>{goalForm=!goalForm;render()};if($('cancelGoal'))$('cancelGoal').onclick=()=>{goalForm=false;render()};if($('goalForm'))$('goalForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),days=f.getAll('day').map(Number),g={id:uid(),name:String(f.get('name')).trim(),duration:Number(f.get('duration')),target:Number(f.get('target')),days,timing:f.get('timing'),start:f.get('start'),end:f.get('end'),priority:f.get('priority')};if(!g.name||!days.length||g.target>days.length||(g.timing==='window'&&minutes(g.end)<=minutes(g.start))){alert('Choose valid days, a weekly target no higher than selected days, and a valid time window.');return}data.goals.push(g);save();goalForm=false;render()};document.querySelectorAll('[data-delete-goal]').forEach(b=>b.onclick=()=>{if(confirm('Delete this goal?')){data.goals=data.goals.filter(g=>String(g.id)!==b.dataset.deleteGoal);save();render()}});document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>{let id=b.dataset.session;if(!data.completedSessions.some(s=>String(s.goal)===id&&s.date===dateKey(new Date())))data.completedSessions.push({goal:id,date:dateKey(new Date())});save();render()});if($('settingsForm'))$('settingsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);['dayStart','dayEnd','workStart','workEnd','wakeTime'].forEach(k=>{if(f.get(k))data[k]=f.get(k)});['commute','routine','prep'].forEach(k=>data[k]=Number(f.get(k)));data.workDays=f.getAll('workDay').map(Number);data.lockWork=f.has('lockWork');data.lockCommute=f.has('lockCommute');if(minutes(data.dayEnd)<=minutes(data.dayStart)){alert('Day end must be after day start.');return}save();alert('Settings saved');render()};if($('export'))$('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='zinni-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};if($('import'))$('import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let o=JSON.parse(await file.text());if(!Array.isArray(o.tasks)||!Array.isArray(o.goals))throw Error('Invalid backup');if(confirm('Replace current data with this backup?')){data=Object.assign({},defaults,o);save();render()}}catch(err){alert('Invalid backup file')}}}
function uid(){return Math.random().toString(36).slice(2,10)}
$('menuBtn').onclick=()=>{menuOpen=!menuOpen;render()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));render();
})();

<script>
(function(){
 let installPrompt=null;
 const btn=document.getElementById('installBtn');
 const help=document.getElementById('installHelp');
 if ('serviceWorker' in navigator && location.protocol !== 'file:') { window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline support unavailable',err))); }
 window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); installPrompt=event; if(btn) btn.classList.remove('hidden'); if(help) help.classList.add('hidden'); });
 window.addEventListener('appinstalled',()=>{ installPrompt=null; if(btn) btn.classList.add('hidden'); if(help) help.classList.add('hidden'); });
 if(btn) btn.addEventListener('click', async()=>{ if(installPrompt){ installPrompt.prompt(); await installPrompt.userChoice; installPrompt=null; btn.classList.add('hidden'); } else if(help){ help.classList.toggle('hidden'); } });
 // Browsers without the install prompt still show manual install guidance in the menu.
 if(btn && !('BeforeInstallPromptEvent' in window)) { btn.classList.remove('hidden'); }
})();
</script>
</body></html>
