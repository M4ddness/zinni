<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zinni — Alpha v2</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29392e;background:#f7f5f0;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.app{max-width:490px;min-height:100vh;margin:auto;padding:24px 18px 60px}.top{display:flex;align-items:center;gap:13px;margin-bottom:28px}.logo{background:#61775e;color:white;border-radius:17px;width:62px;height:62px;display:grid;place-items:center;font-size:29px}.grow{flex:1}h1,h2,h3,p{margin:0}h1{font-size:29px;letter-spacing:-.6px}h2{font-size:27px;line-height:1.2;margin-bottom:8px}h3{font-size:17px}small,.muted,.sub{color:#6f786e}.sub{line-height:1.5;margin-bottom:18px}.card{background:white;border:1px solid #e4e5df;border-radius:19px;padding:19px;margin:14px 0;box-shadow:0 2px 10px #29392e08}.btn{width:100%;border:0;border-radius:12px;padding:14px 16px;background:#5d725a;color:white;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px}.secondary{background:#eef1eb;color:#304531}.ghost{background:transparent;color:#536750}.smallbtn{border:1px solid #d9dfd6;border-radius:10px;background:white;padding:9px 11px;color:#304531;cursor:pointer}.menu{font-size:22px;min-width:62px;min-height:58px}.emoji{display:flex;gap:7px;margin:12px 0 24px}.emoji button{flex:1;min-width:0;border:1px solid #e0e4dd;background:white;border-radius:11px;padding:12px 0;cursor:pointer;font-size:23px}.emoji button.active{border:2px solid #5d725a;background:#eaf0e7}label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #d9dfd6;border-radius:10px;background:white;font:inherit;color:#29392e}input[type=checkbox],input[type=radio]{width:auto}.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}.line{border-bottom:1px solid #eceee9;padding:13px 0;display:flex;align-items:center;gap:10px}.line:last-child{border:0}.pill,.badge{font-size:11px;background:#edf1eb;padding:6px 9px;border-radius:30px;color:#536750}.hidden{display:none!important}.note{font-size:13px;color:#667366;line-height:1.5}.time{font-size:12px;color:#6c766c;min-width:76px}.block{position:relative;border-left:3px solid #a0b19a;padding:13px;background:white;border-radius:0 12px 12px 0;margin:9px 0;display:flex;gap:10px;align-items:center}.block.fixed{border-left-color:#727a7c;background:#f0f0ee}.dropEdge{display:none;position:absolute;left:0;right:0;height:12px;z-index:4}.dropEdge.before{top:0}.dropEdge.after{bottom:0}body.draggingSchedule .dropEdge{display:block;background:#e6efe2;border-radius:8px;cursor:copy}body.draggingSchedule .dropEdge.active{height:18px;background:#bfd3b8}.dropSlots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-height:220px;overflow:auto;margin-top:12px}.dropSlot{border:1px dashed #9daa98;border-radius:9px;padding:10px 6px;text-align:center;background:#f5f7f2;color:#304531;font-size:12px}.dropSlot.active{background:#dce8d8}.line[draggable=true]{cursor:grab;touch-action:none}.line[draggable=true]:active{cursor:grabbing}.row{display:flex;align-items:center;gap:8px}.space{justify-content:space-between}.menuPanel{margin:-13px 0 20px}.menuPanel button{display:block;width:100%;text-align:left;padding:14px;border:0;background:white;border-bottom:1px solid #e5e8e2;cursor:pointer;color:#304531;font-size:15px}.menuPanel button:first-child{border-radius:12px 12px 0 0}.menuPanel button:last-child{border-radius:0 0 12px 12px}.mt{margin-top:18px}.detail{margin-top:8px}.sectionTitle{margin:24px 0 10px}.days{display:flex;gap:5px;flex-wrap:wrap}.days label{font-size:12px;font-weight:500;border:1px solid #dce1d9;padding:8px;border-radius:9px;margin:0;cursor:pointer}.error{color:#a13c37}button:disabled{opacity:.5;cursor:not-allowed}
</style></head><body><main class="app"><header class="top"><div class="logo">🌱</div><div class="grow"><h1>Zinni</h1><small>Your day, at your pace. · Alpha v2</small></div><button class="smallbtn menu" id="menuBtn" aria-label="Open menu">☰</button></header><nav id="menu" class="menuPanel hidden"><button data-page="home">☀️ Today</button><button data-page="tasks">☑ One-time tasks</button><button data-page="goals">↻ Persistent tasks</button><button data-page="needs">🍽 Daily needs</button><button data-page="review">▥ Weekly review</button><button data-page="settings">⚙ Settings</button></nav><div id="view"><h2>Good morning!</h2><p class="sub">How are you feeling today?</p><div class="card"><label>Wake-up time</label><select id="wakeTime">${timeOptions(data.dayStart)}</select>Loading your check-in…</div></div></main>
<script>
(function(){
'use strict';
const KEY='zinni_v2';
const defaults={scheduleOverrides:{},dailyNeeds:{breakfast:{enabled:false,time:'08:00',duration:30},lunch:{enabled:false,time:'12:30',duration:45},dinner:{enabled:false,time:'18:00',duration:60},sleep:{enabled:false,bedtime:'22:00'}},tasks:[],goals:[],mood:3,energy:3,checkDate:'',plan:'',dayStart:'08:00',dayEnd:'21:00',workDays:[1,2,3,4,5],workStart:'09:00',workEnd:'17:00',commute:30,lockWork:true,lockCommute:true,routine:30,prep:30,completedSessions:[]};
let data;try{data=Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'));if(!Array.isArray(data.tasks)||!Array.isArray(data.goals))throw Error('Invalid saved data');}catch(e){data=Object.assign({},defaults)}
data.scheduleOverrides=Object.assign({},data.scheduleOverrides||{});data.dailyNeeds=Object.assign({},defaults.dailyNeeds,data.dailyNeeds||{});['breakfast','lunch','dinner','sleep'].forEach(k=>data.dailyNeeds[k]=Object.assign({},defaults.dailyNeeds[k],data.dailyNeeds[k]||{}));
data.lockCommute=true;
let draftWorkDays=null,draftWorkSchedule=null;
let page='home',stage=(data.checkDate===dateKey(new Date())&&data.plan)?'timeline':'check',menuOpen=false,taskForm=false,goalForm=false,advanced=false,overflow=false,change=null,moving=null;
const $=id=>document.getElementById(id);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function minutes(s){let a=String(s||'00:00').split(':').map(Number);return a[0]*60+a[1]}
function clock(n){return String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function timeOptions(value,from=0,to=1439){let out='';for(let n=Math.ceil(from/15)*15;n<=to;n+=15){let t=clock(n);out+=`<option value="${t}" ${t===value?'selected':''}>${pretty(n)}</option>`}return out}
function timeSelect(name,value,from=0,to=1439){return `<select name="${name}">${timeOptions(value,from,to)}</select>`}
function workTime(day,part){let row=((draftWorkSchedule||data.workSchedule)||{})[day]||{};return row[part]||data[part==="start"?"workStart":"workEnd"]}
function durationHourOptions(selected){let out='';for(let n=0;n<=8;n++)out+=`<option value="${n}" ${Number(selected)===n?'selected':''}>${n} hr</option>`;return out}
function durationMinuteOptions(selected){let out='';for(let n=0;n<=55;n+=5){let v=String(n).padStart(2,'0');out+='<option value=\"'+n+'\" '+(Number(selected)===n?'selected':'')+'>'+v+' min</option>'}return out}
function durationFields(prefix,hours,minutes){return `<div class="two"><select name="${prefix}Hours" aria-label="${prefix} hours">${durationHourOptions(hours)}</select><select name="${prefix}Minutes" aria-label="${prefix} minutes">${durationMinuteOptions(minutes)}</select></div>`}
function moodPlanPreview(){if(data.energy<=2&&data.mood<=2)return 'A lighter schedule that protects fixed commitments, fits essential tasks first, and leaves more room to recover.';if(data.energy>=4&&data.mood>=4)return 'A high-capacity schedule that puts important tasks early and uses more of your open time.';if(data.energy>=4)return 'A focused schedule that uses your available energy for important work, with breathing room between tasks.';return 'A balanced schedule that spreads tasks through open time and keeps some room for breaks.'}
function pretty(n){let h=Math.floor(n/60)%24;return (h%12||12)+':'+String(n%60).padStart(2,'0')+' '+(h>=12?'PM':'AM')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn('Could not save locally',e)}}
function nav(p){draftWorkDays=null;draftWorkSchedule=null;page=p;menuOpen=false;taskForm=false;goalForm=false;render()}
function fixedBlocks(date){let res=[],day=date.getDay(),start=minutes(data.dayStart);function add(a,b,name){if(b>a)res.push({start:a,end:b,name,fixed:true})}add(start,start+Number(data.routine),'Wake-up routine');add(start+Number(data.routine),start+Number(data.routine)+Number(data.prep),'Get ready');let needs=data.dailyNeeds||{};if(data.workDays.includes(day)){let daySchedule=(data.workSchedule||{})[day]||{},ws=minutes(daySchedule.start||data.workStart),we=minutes(daySchedule.end||data.workEnd),c=Number(data.commute);if(data.lockCommute&&c){add(ws-c,ws,'Commute to work');add(we,we+c,'Commute home')}if(data.lockWork){let lunch=needs.lunch,ls=lunch&&lunch.enabled?minutes(lunch.time):0,le=ls+(lunch&&lunch.enabled?Number(lunch.duration||45):0);if(lunch&&lunch.enabled&&ls<we&&le>ws){if(ls>ws)add(ws,ls,'Work');if(le<we)add(le,we,'Work')}else add(ws,we,'Work')}}['breakfast','lunch','dinner'].forEach(k=>{let n=needs[k];if(n&&n.enabled)add(minutes(n.time),minutes(n.time)+Number(n.duration||30),k[0].toUpperCase()+k.slice(1))});if(needs.sleep&&needs.sleep.enabled){let bedtime=minutes(needs.sleep.bedtime),wake=minutes(data.dayStart),end=bedtime>=wake?wake+1440:wake;res.push({start:bedtime,end,name:'Sleep',fixed:true})}return res}
function schedule(date,mode){let start=minutes(data.dayStart),end=minutes(data.dayEnd),blocks=fixedBlocks(date);let candidates=data.tasks.filter(t=>!t.done&&!t.deferred&&(!t.date||t.date<=dateKey(date))&&(dateKey(date)===dateKey(new Date())||t.date===dateKey(date))).map(t=>Object.assign({},t,{source:'task'}));data.goals.forEach(g=>{if(g.days.includes(date.getDay())&&(!g.endDate||g.endDate>=dateKey(date))&&!data.completedSessions.some(s=>s.goal===g.id&&s.date===dateKey(date))){let n=data.completedSessions.filter(s=>s.goal===g.id&&weekStart(s.date)===weekStart(dateKey(date))).length;if(n<g.target)candidates.push({id:'g-'+g.id,name:g.name,duration:g.duration,priority:g.priority||'Would like to do',source:'goal',goal:g})}});let rank=t=>({'Must do':100,'Would like to do':50,'OK if skipped':10}[t.priority]||50)+(t.deadline?Math.max(0,70-Math.max(0,(new Date(t.deadline+'T12:00:00')-date)/86400000)*15):0)+(Number(t.focus||t.consequence||3)*10);candidates.sort((a,b)=>rank(b)-rank(a));let unscheduled=[];for(let t of candidates){let preferred=Number(t.duration)||30,min=t.source==='task'&&!t.approvedStart?Math.min(preferred,Number(t.minDuration)||15):preferred,lengths=[preferred];while(lengths[lengths.length-1]>min){let next=Math.max(min,lengths[lengths.length-1]-15);if(next===lengths[lengths.length-1])break;lengths.push(next)}let placed=false;for(let len of lengths){let lo=start,hi=end-len;if(t.source==='goal'){lo=Math.max(lo,minutes(t.goal.start));hi=t.goal.timing==='fixed'?minutes(t.goal.start):Math.min(hi,minutes(t.goal.end)-len)}if(t.earliest)lo=Math.max(lo,minutes(t.earliest));if(t.latest)hi=Math.min(hi,minutes(t.latest)-len);if(t.approvedStart)lo=hi=minutes(t.approvedStart);let override=(data.scheduleOverrides[dateKey(date)]||{})[String(t.id)];if(override)lo=hi=minutes(override);let slots=[];for(let x=lo;x<=hi;x+=15)if(x>=start&&x+len<=end&&!blocks.some(b=>x<b.end&&x+len>b.start))slots.push(x);if(slots.length){let at=mode==='balanced'?slots[Math.floor((slots.length-1)/2)]:slots[0];blocks.push({start:at,end:at+len,name:t.name,id:t.id,source:t.source,fixed:false,duration:len});placed=true;break}}if(!placed)unscheduled.push(t)}blocks.sort((a,b)=>a.start-b.start);if(data.autoBreaks){let additions=[];for(let i=0;i<blocks.length-1;i++){let a=blocks[i],b=blocks[i+1];if(!a.fixed&&!b.fixed&&b.start-a.end>=Number(data.breakDuration||15))additions.push({start:a.end,end:a.end+Number(data.breakDuration||15),name:'Break',fixed:true,break:true})}blocks.push(...additions);blocks.sort((a,b)=>a.start-b.start)}return {blocks,unscheduled}}
function weekStart(s){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return dateKey(d)}
function timelineMarkup(blocks){return blocks.map(b=>{let task=data.tasks.find(t=>String(t.id)===String(b.id)),label=b.fixed?'🔒 Fixed commitment':b.source==='goal'?'Persistent task':'Task',scaled=b.source==='task'&&b.duration<Number((task||{}).duration||b.duration)?' · scaled to '+b.duration+' min':'';return '<div class=block '+(b.fixed?'fixed':'')+' draggable='+(b.fixed?'false':'true')+' data-drag='+(b.fixed?'':esc(b.id))+'><div class=dropEdge before data-edge=before data-edge-time='+b.start+'></div><div class=time>'+pretty(b.start)+'<br><small>'+pretty(b.end)+'</small></div><div class=grow><strong>'+esc(b.name)+'</strong><div class=note>'+label+scaled+'</div></div>'+(b.fixed?'':'<button class=smallbtn data-complete='+esc(b.id)+'>✓</button>')+'<div class=dropEdge after data-edge=after data-edge-time='+b.end+'></div></div>'}).join('')}
function home(){if(stage==='check')return `<h2>Good morning!</h2><p class="sub">How are you feeling today?</p><div class="card"><label>Wake-up time</label><select id="wakeTime">${timeOptions(data.dayStart)}</select><h3>Mood</h3><div class="emoji">${['😞','😕','😐','🙂','😄'].map((x,i)=>`<button data-mood="${i+1}" class="${data.mood===i+1?'active':''}" aria-label="Mood ${i+1}">${x}</button>`).join('')}</div><h3>Energy</h3><div class="emoji">${['🪫','😴','😐','⚡','🔋'].map((x,i)=>`<button data-energy="${i+1}" class="${data.energy===i+1?'active':''}" aria-label="Energy ${i+1}">${x}</button>`).join('')}</div><p class="note detail">${moodPlanPreview()}</p><button class="btn" id="suggest">Suggest my plan →</button></div><p class="note">Just two questions. Zinni uses your saved tasks and commitments for the rest.</p>`;
let sch=schedule(new Date(),data.plan||'balanced');return `<div class="row space"><div><small>TODAY · ${esc(new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}))}</small><h2>Your timeline</h2></div><span class="pill">Daily plan</span></div><div class="row space"><p class="sub">Mood ${data.mood}/5 · Energy ${data.energy}/5</p><button class="smallbtn" id="editCheckin">Edit check-in</button></div>${sch.blocks.length?timelineMarkup(sch.blocks):'<div class="card"><h3>Your day is clear</h3><p class="note detail">Add a task from the menu whenever you need to.</p></div>'}${sch.unscheduled.length?`<div class="card"><h3>${sch.unscheduled.length} task(s) not scheduled</h3><p class="note detail">These stay unscheduled until you decide.</p><button class="btn secondary" id="overflow">Review options</button>${overflow?sch.unscheduled.map(t=>`<div class="line"><div class="grow"><strong>${esc(t.name)}</strong><p class="note">No slot is assigned automatically. You can edit the task or review another day.</p></div></div>`).join(''):''}</div>`:''}<button class="btn ghost" id="requestBreak">Request a break</button>${change==='break'?`<div class="card"><h3>Request a break</h3><p class="note">Choose a duration. Zinni will propose a slot; nothing is added until you approve.</p><div class="two"><button class="btn secondary" data-break="5">5 min</button><button class="btn secondary" data-break="10">10 min</button><button class="btn secondary" data-break="15">15 min</button></div><button class="btn ghost" id="cancelChange">Cancel</button></div>`:''}${change==='break-confirm'?`<div class="card"><h3>Choose break time</h3><p class="note">Pick when the ${window.pendingBreak||10}-minute break should start.</p><label>Start time</label><select id="breakTime">${timeOptions(window.pendingBreakStart||data.dayStart,minutes(data.dayStart),minutes(data.dayEnd)-Number(window.pendingBreak||10))}</select><button class="btn" id="approveBreak">Add break</button><button class="btn ghost" id="cancelChange">Cancel</button></div>`:''}`}
function tasksPage(){return `<h2>One-time tasks</h2><p class="sub">Quickly add a task. Details are optional.</p><button class="btn" id="newTask">+ Add task</button>${taskForm?`<form class="card" id="taskForm"><label>Task name</label><input name="name" required maxlength="100" placeholder="What do you need to do?"><label>Preferred duration</label>${durationFields('duration',0,30)}<label><input type="checkbox" name="allowShorter" id="allowShorter"> Allow this task to be shortened if needed</label><div id="minimumDurationFields" class="hidden"><label>Minimum duration</label>${durationFields('minDuration',0,15)}</div><button type="button" class="btn secondary" id="advanced">${advanced?'Hide':'Show'} advanced options</button><div class="${advanced?'':'hidden'}"><label>Priority</label><select name="priority"><option>Would like to do</option><option>Must do</option><option>OK if skipped</option></select><label>Deadline (optional)</label><input name="deadline" type="date"><label>Focus level (1–5)</label><input name="focus" type="number" min="1" max="5" value="3"><label>Earliest start</label><select name="earliest"><option value="">No earliest time</option>${timeOptions('')}</select><label>Latest finish</label><select name="latest"><option value="">No latest time</option>${timeOptions('')}</select></div><button class="btn" type="submit">Save task</button><button type="button" class="btn ghost" id="cancelTask">Cancel</button></form>`:''}${data.tasks.map(t=>`<div class="line"><button class="smallbtn" data-complete="${esc(t.id)}">${t.done?'↶':'✓'}</button><div class="grow"><strong style="${t.done?'text-decoration:line-through':''}">${esc(t.name)}</strong><p class="note">${t.duration} min · ${esc(t.priority||'Would like to do')}${t.deadline?' · Due '+esc(t.deadline):''}</p></div><button class="smallbtn" data-delete-task="${esc(t.id)}">✕</button></div>`).join('')||'<div class="card note">No tasks yet. Start with one small thing.</div>'}`}
function goalsPage(){return `<h2>Persistent tasks</h2><p class="sub">Choose days and a fixed time or time window for each activity.</p><button class="btn" id="newGoal">+ Add persistent task</button>${goalForm?`<form class="card" id="goalForm"><label>Persistent task name</label><input name="name" required maxlength="100" placeholder="e.g. Study networking"><div class="two"><div><label>Sessions per week</label><input name="target" type="number" min="1" max="7" value="3" required></div><div><label>Minutes per session</label><input name="duration" type="number" min="15" max="480" step="15" value="45" required></div></div><label>End date (optional)</label><input name="endDate" type="date"><label>Selected days</label><div class="days">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<label><input type="checkbox" name="day" value="${i}" ${[1,3,5].includes(i)?'checked':''}> ${d}</label>`).join('')}</div><label>Schedule type</label><select name="timing"><option value="window">Time window</option><option value="fixed">Fixed time</option></select><div class="two"><div><label>Start</label>${timeSelect('start','18:00')}</div><div><label>End (window)</label>${timeSelect('end','21:00')}</div></div><label>Priority</label><select name="priority"><option>Would like to do</option><option>Must do</option><option>OK if skipped</option></select><button class="btn" type="submit">Save task</button><button type="button" class="btn ghost" id="cancelGoal">Cancel</button></form>`:''}${data.goals.map(g=>{let count=data.completedSessions.filter(s=>s.goal===g.id&&weekStart(s.date)===weekStart(dateKey(new Date()))).length;return `<div class="card"><div class="row space"><h3>${esc(g.name)}</h3><button class="smallbtn" data-delete-goal="${esc(g.id)}">✕</button></div><p class="note detail">${g.days.map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(' · ')} · ${g.duration} min · ${g.timing==='fixed'?'Fixed at '+g.start:g.start+'–'+g.end}</p><p class="note detail">This week: ${count}/${g.target} sessions</p><button class="btn secondary" data-session="${esc(g.id)}">Mark a session complete</button></div>`}).join('')||'<div class="card note">No persistent tasks yet.</div>'}<p class="note mt">Missed sessions remain unscheduled until you decide on a new slot.</p>`}
function workDaysDropdown(){let names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],selected=names.filter((d,i)=>data.workDays.includes(i)).join(', ')||'None selected';return '<details id=\"workDaysMenu\" class=\"card\"><summary>Work days: '+selected+'</summary><div class=\"days\">'+names.map((d,i)=>'<label><input type=\"checkbox\" name=\"workDay\" value=\"'+i+'\" '+(data.workDays.includes(i)?'checked':'')+'> '+d+'</label>').join('')+'</div>'+'<div id=\"workHoursRows\">'+workDayRows()+'</div></details>'}
function workDayRows(){let names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];return (draftWorkDays||data.workDays).map(i=>{let day=names[i];return '<div class=\"line\"><strong>'+day+'</strong><div class=\"grow\"><div class=\"two\"><div><label>Start</label>'+timeSelect('workStart'+i,workTime(i,'start'))+'</div><div><label>End</label>'+timeSelect('workEnd'+i,workTime(i,'end'))+'</div></div></div></div>'}).join('')}
function needsPage(){let n=data.dailyNeeds;return '<h2>Daily needs</h2><p class=\"sub\">Protect meals and sleep in your daily schedule.</p><form id=\"dailyNeedsForm\" class=\"card\">'+'<h3 class=\"sectionTitle\">Meals</h3>'+needRow('breakfast','Breakfast')+needRow('lunch','Lunch')+needRow('dinner','Dinner')+'<h3 class=\"sectionTitle\">Sleep</h3><label><input type=\"checkbox\" name=\"sleepEnabled\" '+(n.sleep.enabled?'checked':'')+'> Schedule sleep</label><label>Bedtime</label>'+timeSelect('bedtime',n.sleep.bedtime)+'<p class=\"note detail\">Sleep runs from bedtime to your wake-up time on the Today page.</p><button class=\"btn\" type=\"submit\">Save daily needs</button></form>'}
function needRow(key,title){let n=data.dailyNeeds[key],durations=[15,30,45,60,75,90,120],opts=durations.map(v=>'<option value=\"'+v+'\" '+(Number(n.duration)===v?'selected':'')+'>'+v+' minutes</option>').join('');return '<div class=\"card\"><label><input type=\"checkbox\" name=\"enabled_'+key+'\" '+(n.enabled?'checked':'')+'> Schedule '+title.toLowerCase()+'</label><div class=\"two\"><div><label>Time</label>'+timeSelect('time_'+key,n.time)+'</div><div><label>Duration</label><select name=\"duration_'+key+'\">'+opts+'</select></div></div></div>'}
function settingsPage(){return `<h2>Settings</h2><p class="sub">Detailed controls stay out of your morning check-in.</p><form id="settingsForm" class="card"><h3>Daily availability</h3><h3 class="sectionTitle">Work and commute</h3><p class="note">Set different work hours for each day. Unchecked days have no work block.</p>${workDaysDropdown()}<label><input type="checkbox" name="lockWork" ${data.lockWork?'checked':''}> Lock work time</label><p class="note">🔒 Commute time is locked to before and after work hours.</p><label>Commute each way (minutes)</label><input name="commute" type="number" min="0" max="180" step="5" value="${data.commute}"><h3 class="sectionTitle">Wake-up routine</h3><div class="two"><div><label>Routine (min)</label><input name="routine" type="number" min="0" max="180" step="15" value="${data.routine}"></div><div><label>Get ready (min)</label><input name="prep" type="number" min="0" max="180" step="15" value="${data.prep}"></div></div><h3 class="sectionTitle">Breaks</h3><label><input type="checkbox" name="autoBreaks" ${data.autoBreaks?'checked':''}> Add a break between scheduled tasks when time allows</label><label>Break length</label><select name="breakDuration"><option value="5" ${data.breakDuration===5?'selected':''}>5 minutes</option><option value="10" ${data.breakDuration===10?'selected':''}>10 minutes</option><option value="15" ${data.breakDuration!==5&&data.breakDuration!==10?'selected':''}>15 minutes</option></select><button class="btn" type="submit">Save settings</button></form><div class="card"><h3>Data</h3><p class="note detail">Saved in this browser. Export a backup before clearing browser data.</p><button class="btn secondary" id="export">Download backup (JSON)</button><label>Restore backup</label><input type="file" id="import" accept="application/json,.json"></div>`}
function reviewPage(){let done=data.tasks.filter(t=>t.done).length,total=data.tasks.length;return `<h2>Weekly review</h2><p class="sub">Review progress and consider improvements. Nothing changes without your approval.</p><div class="card"><h3>One-time tasks</h3><h2 class="mt">${done} / ${total}</h2><p class="note">Completed tasks</p></div><div class="card"><h3>Persistent task sessions</h3>${data.goals.map(g=>{let n=data.completedSessions.filter(s=>s.goal===g.id&&weekStart(s.date)===weekStart(dateKey(new Date()))).length;return `<div class="line"><span class="grow">${esc(g.name)}</span><strong>${n}/${g.target}</strong></div>`}).join('')||'<p class="note detail">No persistent tasks yet.</p>'}</div><div class="card"><h3>Next week</h3><p class="note detail">Review task duration estimates, completed sessions, and patterns. Personalized learning from long-term history will be expanded in a later version.</p></div>`}
function render(){try{$('menu').classList.toggle('hidden',!menuOpen);let v=$('view');v.innerHTML=page==='home'?home():page==='tasks'?tasksPage():page==='goals'?goalsPage():page==='needs'?needsPage():page==='settings'?settingsPage():reviewPage();bind()}catch(err){console.error(err);$('view').innerHTML='<div class="card"><h2>Something went wrong</h2><p class="note">'+esc(err.message||err)+'</p><button class="btn" onclick="location.reload()">Refresh app</button></div>'}}
function bind(){document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{data.mood=Number(b.dataset.mood);save();render()});if($('wakeTime'))$('wakeTime').onchange=()=>{data.dayStart=$('wakeTime').value;save();render()};document.querySelectorAll('[data-energy]').forEach(b=>b.onclick=()=>{data.energy=Number(b.dataset.energy);save();render()});if($('suggest'))$('suggest').onclick=()=>{data.plan='balanced';data.checkDate=dateKey(new Date());stage='timeline';save();render()};if($('editCheckin'))$('editCheckin').onclick=()=>{stage='check';render()};document.querySelectorAll('[data-drag]').forEach(el=>{if(!el.dataset.drag)return;el.ondragstart=e=>{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(el.dataset.drag));document.body.classList.add('draggingSchedule')};el.ondragend=()=>document.body.classList.remove('draggingSchedule')});document.querySelectorAll('.dropEdge').forEach(edge=>{edge.ondragover=e=>{e.preventDefault();edge.classList.add('active')};edge.ondragleave=()=>edge.classList.remove('active');edge.ondrop=e=>{e.preventDefault();let id=e.dataTransfer.getData('text/plain'),now=new Date(),sch=schedule(now,data.plan||'balanced'),block=sch.blocks.find(b=>String(b.id)===String(id)),edgeTime=Number(edge.dataset.edgeTime);if(!block)return;let duration=block.end-block.start,start=edge.dataset.edge==='before'?edgeTime-duration:edgeTime;if(start<minutes(data.dayStart)||start+duration>minutes(data.dayEnd)){alert('There is not enough room there for this activity.');document.body.classList.remove('draggingSchedule');return}if(sch.blocks.some(b=>String(b.id)!==String(id)&&start<b.end&&start+duration>b.start)){alert('That position overlaps another scheduled item.');document.body.classList.remove('draggingSchedule');return}data.scheduleOverrides[dateKey(now)]=data.scheduleOverrides[dateKey(now)]||{};data.scheduleOverrides[dateKey(now)][String(id)]=clock(start);save();document.body.classList.remove('draggingSchedule');render()}});if($('overflow'))$('overflow').onclick=()=>{overflow=!overflow;render()};document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{let id=b.dataset.complete;if(id.startsWith('g-')){let goal=id.slice(2);if(!data.completedSessions.some(s=>s.goal===goal&&s.date===dateKey(new Date())))data.completedSessions.push({goal,date:dateKey(new Date())})}else{let t=data.tasks.find(t=>String(t.id)===id);if(t)t.done=!t.done}save();render()});document.querySelectorAll('[data-defer]').forEach(b=>b.onclick=()=>{let t=data.tasks.find(t=>String(t.id)===b.dataset.defer);if(t)t.deferred=true;save();render()});if($('requestBreak'))$('requestBreak').onclick=()=>{change='break';render()};document.querySelectorAll('[data-break]').forEach(b=>b.onclick=()=>{window.pendingBreak=Number(b.dataset.break);change='break-confirm';render()});if($('cancelChange'))$('cancelChange').onclick=()=>{change=null;render()};if($('approveBreak'))$('approveBreak').onclick=()=>{let dur=window.pendingBreak||10,found=minutes($('breakTime').value),sch=schedule(new Date(),data.plan||'balanced');if(!sch.blocks.some(b=>found<b.end&&found+dur>b.start)){data.tasks.push({id:uid(),name:'Break',duration:dur,priority:'Must do',date:dateKey(new Date()),approvedStart:clock(found),done:false});save();change=null;render()}else alert('That time overlaps a scheduled item. Choose another time.')};if($('newTask'))$('newTask').onclick=()=>{taskForm=!taskForm;render()};if($('cancelTask'))$('cancelTask').onclick=()=>{taskForm=false;render()};if($('allowShorter'))$('allowShorter').onchange=()=>{$('minimumDurationFields').classList.toggle('hidden',!$('allowShorter').checked)};if($('advanced'))$('advanced').onclick=()=>{advanced=!advanced;let panel=$('advanced').nextElementSibling;panel.classList.toggle('hidden',!advanced);$('advanced').textContent=(advanced?'Hide':'Show')+' advanced options'};if($('taskForm'))$('taskForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let t={id:uid(),name:String(f.get('name')).trim(),duration:Number(f.get('durationHours'))*60+Number(f.get('durationMinutes')),minDuration:f.has('allowShorter')?Number(f.get('minDurationHours'))*60+Number(f.get('minDurationMinutes')):Number(f.get('durationHours'))*60+Number(f.get('durationMinutes')),priority:f.get('priority')||'Would like to do',deadline:f.get('deadline')||'',focus:Number(f.get('focus'))||3,earliest:f.get('earliest')||'',latest:f.get('latest')||'',done:false};if(!t.name)return;if(t.duration<=0){alert('Preferred duration must be greater than zero.');return}if(t.minDuration<=0){alert('Minimum duration must be greater than zero.');return}if(t.minDuration>t.duration){alert('Minimum duration cannot be greater than preferred duration.');return}data.tasks.push(t);save();taskForm=false;render()};document.querySelectorAll('[data-delete-task]').forEach(b=>b.onclick=()=>{if(confirm('Delete this task?')){data.tasks=data.tasks.filter(t=>String(t.id)!==b.dataset.deleteTask);save();render()}});if($('newGoal'))$('newGoal').onclick=()=>{goalForm=!goalForm;render()};if($('cancelGoal'))$('cancelGoal').onclick=()=>{goalForm=false;render()};if($('goalForm'))$('goalForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),days=f.getAll('day').map(Number),g={id:uid(),name:String(f.get('name')).trim(),duration:Number(f.get('duration')),target:Number(f.get('target')),days,timing:f.get('timing'),start:f.get('start'),end:f.get('end'),endDate:f.get('endDate')||'',priority:f.get('priority')};if(!g.name||!days.length||g.target>days.length||(g.timing==='window'&&minutes(g.end)<=minutes(g.start))){alert('Choose valid days, a weekly target no higher than selected days, and a valid time window.');return}data.goals.push(g);save();goalForm=false;render()};document.querySelectorAll('[data-delete-goal]').forEach(b=>b.onclick=()=>{if(confirm('Delete this goal?')){data.goals=data.goals.filter(g=>String(g.id)!==b.dataset.deleteGoal);save();render()}});document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>{let id=b.dataset.session;if(!data.completedSessions.some(s=>String(s.goal)===id&&s.date===dateKey(new Date())))data.completedSessions.push({goal:id,date:dateKey(new Date())});save();render()});if($('dailyNeedsForm'))$('dailyNeedsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),next={};['breakfast','lunch','dinner'].forEach(k=>next[k]={enabled:f.has('enabled_'+k),time:f.get('time_'+k),duration:Number(f.get('duration_'+k))||30});next.sleep={enabled:f.has('sleepEnabled'),bedtime:f.get('bedtime')};data.dailyNeeds=next;save();alert('Daily needs saved');render()};if($('settingsForm'))document.querySelectorAll('input[name=workDay]').forEach(cb=>cb.onchange=()=>{let f=new FormData($('settingsForm'));draftWorkSchedule=Object.assign({},draftWorkSchedule||data.workSchedule||{});for(let d=0;d<7;d++){let ws=f.get('workStart'+d),we=f.get('workEnd'+d);if(ws&&we)draftWorkSchedule[d]={start:ws,end:we}}draftWorkDays=Array.from(document.querySelectorAll('input[name=workDay]:checked')).map(x=>Number(x.value));let names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],label=draftWorkDays.map(d=>names[d]).join(', ')||'None selected';$('workDaysMenu').querySelector('summary').textContent='Work days: '+label;$('workHoursRows').innerHTML=workDayRows()});if($('settingsForm'))$('settingsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);['commute','routine','prep'].forEach(k=>data[k]=Number(f.get(k)));data.workDays=f.getAll('workDay').map(Number);data.workSchedule=Object.assign({},draftWorkSchedule||data.workSchedule||{});for(let d=0;d<7;d++){let ws=f.get('workStart'+d),we=f.get('workEnd'+d);data.workSchedule[d]={start:ws||workTime(d,'start'),end:we||workTime(d,'end')}}if(data.workDays.some(d=>minutes(data.workSchedule[d].end)<=minutes(data.workSchedule[d].start))){alert('Each workday must end after it starts.');return}data.lockWork=f.has('lockWork');data.lockCommute=true;data.autoBreaks=f.has('autoBreaks');data.breakDuration=Number(f.get('breakDuration'))||15;if(minutes(data.dayEnd)<=minutes(data.dayStart)){alert('Day end must be after day start.');return}save();draftWorkDays=null;draftWorkSchedule=null;alert('Settings saved');render()};if($('export'))$('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='zinni-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};if($('import'))$('import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let o=JSON.parse(await file.text());if(!Array.isArray(o.tasks)||!Array.isArray(o.goals))throw Error('Invalid backup');if(confirm('Replace current data with this backup?')){data=Object.assign({},defaults,o);save();render()}}catch(err){alert('Invalid backup file')}}}
function uid(){return Math.random().toString(36).slice(2,10)}
$('menuBtn').onclick=()=>{menuOpen=!menuOpen;render()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));render();
})();
</script></body></html>
